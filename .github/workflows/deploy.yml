name: Build & Deploy to Portainer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: false

      - name: 🎯 Setup Dart (Latest Stable)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🌐 Build Flutter Web App
        run: |
          cd todolist_flutter
          flutter build web --release --output ../todolist_server/web/app

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set Lowercase Repo Name for Docker Tag
        id: repo_name
        run: echo "IMAGE_TAG=ghcr.io/${GITHUB_REPOSITORY,,}/server:latest" >> $GITHUB_ENV

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: todolist_server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: 🔄 Trigger Portainer Redeploy Webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "Triggering Portainer Webhook..."
            curl -k -X POST "$PORTAINER_WEBHOOK_URL"
            echo "Portainer Webhook triggered successfully!"
          else
            echo "PORTAINER_WEBHOOK_URL secret not set. Skipping webhook trigger."
          fi
