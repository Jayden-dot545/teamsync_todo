version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: todolist-db
    restart: always
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: EinSicheresPasswort123
    volumes:
      - todolist_db_data:/var/lib/postgresql/data
    networks:
      - todolist_network

  server:
    image: ghcr.io/jayden-dot545/teamsync_todo/server:latest
    container_name: todolist-server
    restart: always
    depends_on:
      - db
    environment:
      runmode: production
      serverid: default
      logging: normal
      role: monolith
      SERVERPOD_APPLY_MIGRATIONS: "true"
      SERVERPOD_API_SERVER_PUBLIC_HOST: localhost
      SERVERPOD_API_SERVER_PUBLIC_PORT: "443"
      SERVERPOD_API_SERVER_PUBLIC_SCHEME: https
      SERVERPOD_DATABASE_HOST: db
      SERVERPOD_DATABASE_PORT: "5432"
      SERVERPOD_DATABASE_NAME: todolist
      SERVERPOD_DATABASE_USER: postgres
      SERVERPOD_DATABASE_REQUIRE_SSL: "false"
      SERVERPOD_PASSWORD_database: EinSicheresPasswort123
      SERVERPOD_PASSWORD_serviceSecret: DeinGeheimesServiceSecretHier123
    ports:
      - "8080:8080"
      - "8082:8082"
    networks:
      - todolist_network

volumes:
  todolist_db_data:
    driver: local

networks:
  todolist_network:
    driver: bridge
