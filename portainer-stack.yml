version: '3.8'

services:
  db:
    image: 'postgres:16-alpine'
    container_name: todolist-db
    restart: always
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-todolist}'
      - 'POSTGRES_USER=${POSTGRES_USER:-postgres}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-EinSicheresPasswort123}'
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    command:
      - sh
      - -c
      - |
        if [ -f /var/lib/postgresql/data/pg_hba.conf ]; then
          sed -i '1i host all all all trust' /var/lib/postgresql/data/pg_hba.conf
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - todolist_db_data:/var/lib/postgresql/data
    networks:
      - todolist_network

  server:
    image: '${SERVER_IMAGE_NAME:-ghcr.io/jayden-dot545/teamsync_todo/server:latest}'
    container_name: todolist-server
    restart: always
    depends_on:
      - db
    environment:
      - 'runmode=${RUN_MODE:-production}'
      - 'serverid=${SERVER_ID:-default}'
      - 'logging=${LOGGING_MODE:-normal}'
      - 'role=${SERVER_ROLE:-monolith}'
      - 'SERVERPOD_APPLY_MIGRATIONS=${APPLY_MIGRATIONS:-true}'
      - 'SERVERPOD_API_SERVER_PUBLIC_HOST=${API_HOST:-localhost}'
      - 'SERVERPOD_API_SERVER_PUBLIC_PORT=${PUBLIC_PORT:-443}'
      - 'SERVERPOD_API_SERVER_PUBLIC_SCHEME=${PUBLIC_SCHEME:-https}'
      - 'SERVERPOD_WEB_SERVER_PUBLIC_HOST=${WEB_HOST:-localhost}'
      - 'SERVERPOD_WEB_SERVER_PUBLIC_PORT=${PUBLIC_PORT:-443}'
      - 'SERVERPOD_WEB_SERVER_PUBLIC_SCHEME=${PUBLIC_SCHEME:-https}'
      - 'SERVERPOD_DATABASE_HOST=${DB_HOST:-db}'
      - 'SERVERPOD_DATABASE_PORT=${DB_PORT:-5432}'
      - 'SERVERPOD_DATABASE_NAME=${POSTGRES_DB:-todolist}'
      - 'SERVERPOD_DATABASE_USER=${POSTGRES_USER:-postgres}'
      - 'SERVERPOD_DATABASE_REQUIRE_SSL=${DB_REQUIRE_SSL:-false}'
      - 'SERVERPOD_PASSWORD_database=${DB_PASSWORD:-EinSicheresPasswort123}'
      - 'SERVERPOD_PASSWORD_serviceSecret=${SERVICE_SECRET:-DeinGeheimesServiceSecretHier123}'
      - 'SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper=${JWT_REFRESH_PEPPER:-xtxwqR-2dMf1MfTc91ziWZQQIoG1OSJF}'
      - 'SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey=${JWT_PRIVATE_KEY:-dCle2CzkOCJyMvTwvtr4-GnSuik-qpKX}'
      - 'SERVERPOD_PASSWORD_emailSecretHashPepper=${EMAIL_SECRET_PEPPER:-BKvLQw22SWrFlWnfZSO-Kd7iGglf-VYr}'
    ports:
      - '${SERVER_PORT:-8080}:8080'
    networks:
      - todolist_network

  client:
    image: '${CLIENT_IMAGE_NAME:-ghcr.io/jayden-dot545/teamsync_todo/client:latest}'
    container_name: todolist-client
    restart: always
    depends_on:
      - server
    environment:
      - 'API_URL=${API_URL:-https://localhost}'
    ports:
      - '${CLIENT_PORT:-8082}:80'
    networks:
      - todolist_network

volumes:
  todolist_db_data:
    driver: local

networks:
  todolist_network:
    driver: bridge
